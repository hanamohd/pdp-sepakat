<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Kuiz Snake Matematik Tahun 1</title>
  <!-- Google Fonts: Fredoka & Lexend for young children -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --purple-main: #8a4fff;
      --purple-light: #f3ebff;
      --purple-dark: #5e22ca;
      --orange-main: #ff8c42;
      --orange-light: #fff3eb;
      --orange-hover: #ff751a;
      --green-correct: #2ed573;
      --red-wrong: #ff4757;
      --bg-gradient: linear-gradient(135deg, #f3ebff 0%, #fff3eb 100%);
      --text-dark: #2d3436;
      --card-shadow: 0 10px 25px rgba(138, 79, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      font-family: 'Fredoka', 'Lexend', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: var(--card-shadow);
      border: 4px solid var(--purple-main);
      overflow: hidden;
      position: relative;
    }

    /* --- PAGE 1: MUKA HADAPAN --- */
    .screen {
      display: none;
      padding: 24px 20px;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .screen.active {
      display: flex;
    }

    .title-banner {
      background: var(--orange-main);
      color: white;
      padding: 16px 20px;
      border-radius: 20px;
      width: 100%;
      box-shadow: 0 6px 0 #d96b20;
      margin-bottom: 24px;
    }

    .title-banner h1 {
      font-size: 1.8rem;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .title-banner p {
      font-size: 1.1rem;
      margin-top: 6px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 12px;
      display: inline-block;
    }

    .form-group {
      width: 100%;
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      font-size: 1.2rem;
      color: var(--purple-dark);
      font-weight: 700;
      display: block;
      margin-bottom: 8px;
    }

    .input-box {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.2rem;
      font-family: 'Fredoka', sans-serif;
      border: 3px solid #e0d0ff;
      border-radius: 16px;
      outline: none;
      transition: all 0.2s;
      background: #faf7ff;
    }

    .input-box:focus {
      border-color: var(--purple-main);
      background: #ffffff;
    }

    .class-selector {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .class-btn {
      flex: 1;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      border: 3px solid var(--purple-main);
      background: var(--purple-light);
      color: var(--purple-dark);
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .class-btn.selected {
      background: var(--purple-main);
      color: white;
      box-shadow: 0 4px 0 var(--purple-dark);
    }

    .start-btn {
      width: 100%;
      background: var(--orange-main);
      color: white;
      border: none;
      padding: 16px;
      font-size: 1.5rem;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      border-radius: 20px;
      box-shadow: 0 6px 0 #d96b20;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.1s;
    }

    .start-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d96b20;
    }

    /* --- PAGE 2: RUANG GAME --- */
    .game-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--purple-light);
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      border: 2px solid #e0d0ff;
    }

    .info-badge {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--purple-dark);
    }

    .score-badge {
      background: var(--orange-main);
      color: white;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 3px 0 #d96b20;
    }

    .canvas-container {
      width: 100%;
      position: relative;
      background: #faf8ff;
      border: 4px solid var(--purple-main);
      border-radius: 16px;
      overflow: hidden;
      touch-action: none; /* Prevents scrolling when swiping on canvas */
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      background-color: #f7f2ff;
    }

    /* Touch Controls / D-Pad */
    .controls-panel {
      width: 100%;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .dpad-row {
      display: flex;
      gap: 12px;
    }

    .dbtn {
      width: 58px;
      height: 58px;
      background: var(--purple-light);
      border: 3px solid var(--purple-main);
      border-radius: 16px;
      font-size: 1.6rem;
      color: var(--purple-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #c2a3ff;
      touch-action: manipulation;
    }

    .dbtn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #c2a3ff;
      background: var(--purple-main);
      color: white;
    }

    /* Modal Soalan Overlay */
    .modal-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(45, 52, 54, 0.88);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .question-card {
      background: #ffffff;
      width: 100%;
      max-height: 96%;
      border-radius: 24px;
      border: 4px solid var(--orange-main);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      overflow-y: auto;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
      margin-bottom: 8px;
    }

    .q-level {
      background: var(--purple-light);
      color: var(--purple-dark);
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .q-score {
      background: var(--orange-light);
      color: var(--orange-main);
      padding: 4px 12px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .q-image-box {
      width: 100%;
      height: 120px;
      background: #fff8f3;
      border: 2px dashed var(--orange-main);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      padding: 6px;
    }

    .q-image-box svg {
      max-width: 100%;
      max-height: 100%;
    }

    .q-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.35;
      width: 100%;
      text-align: center;
    }

    .attempt-text {
      font-size: 0.95rem;
      color: var(--purple-dark);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .options-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-btn {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.15rem;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      background: var(--purple-light);
      color: var(--purple-dark);
      border: 3px solid #d4bfff;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .option-btn:hover, .option-btn:active {
      background: var(--purple-main);
      color: white;
      border-color: var(--purple-dark);
    }

    .feedback-msg {
      margin-top: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      min-height: 28px;
    }

    .feedback-msg.correct { color: var(--green-correct); }
    .feedback-msg.wrong { color: var(--red-wrong); }

    /* --- PAGE 3: PAPARAN AKHIR (SQUARE CARD) --- */
    .result-square-card {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border: 5px solid var(--purple-main);
      border-radius: 28px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 20px rgba(138, 79, 255, 0.2);
      background-image: radial-gradient(var(--purple-light) 15%, transparent 16%);
      background-size: 20px 20px;
    }

    .res-title {
      font-size: 1.6rem;
      color: var(--orange-main);
      font-weight: 700;
    }

    .res-info {
      font-size: 1.25rem;
      color: var(--purple-dark);
      font-weight: 700;
    }

    .score-circle {
      width: 110px;
      height: 110px;
      background: var(--orange-main);
      color: white;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 0 #d96b20;
    }

    .score-circle .num {
      font-size: 2.2rem;
      line-height: 1;
      font-weight: 700;
    }

    .score-circle .total {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .stars-row {
      font-size: 1.8rem;
      color: #ffc107;
    }

    .restart-btn {
      background: var(--purple-main);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: 'Fredoka', sans-serif;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--purple-dark);
    }

    .restart-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--purple-dark);
    }
  </style>
</head>
<body>

<div class="app-container">

  <!-- ================= PAGE 1: MUKA HADAPAN ================= -->
  <div id="startScreen" class="screen active">
    <div class="title-banner">
      <h1>KUIZ SNAKE MATEMATIK</h1>
      <p>Panjang, Jisim & Isipadu Cecair</p>
    </div>

    <div class="form-group">
      <label for="studentName">Nama Murid:</label>
      <input type="text" id="studentName" class="input-box" placeholder="Taip nama di sini..." autocomplete="off">
    </div>

    <div class="form-group">
      <label>Pilih Kelas:</label>
      <div class="class-selector">
        <button type="button" class="class-btn selected" onclick="selectClass('1 Sukses', this)">1 Sukses</button>
        <button type="button" class="class-btn" onclick="selectClass('1 Super', this)">1 Super</button>
      </div>
    </div>

    <button type="button" class="start-btn" onclick="startGame()">MULA MAIN 🐍</button>
  </div>

  <!-- ================= PAGE 2: RUANG GAME ================= -->
  <div id="gameScreen" class="screen">
    <div class="game-header">
      <div class="info-badge" id="playerDisplay">Nama (Kelas)</div>
      <div class="score-badge">Markah: <span id="currentScore">0</span></div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      
      <!-- Modal Overlay Soalan -->
      <div id="questionModal" class="modal-overlay">
        <div class="question-card">
          <div class="q-header">
            <span id="qLevel" class="q-level">Aras: Rendah</span>
            <span id="qNum" class="q-score">Soalan 1/15</span>
          </div>

          <div id="qImage" class="q-image-box">
            <!-- SVG Image Injected Dynamically -->
          </div>

          <div id="qText" class="q-text">Soalan akan dipaparkan di sini...</div>
          <div id="attemptText" class="attempt-text">Percubaan Pertama (2 Markah)</div>

          <div id="optionsContainer" class="options-grid">
            <!-- Option Buttons Injected Dynamically -->
          </div>

          <div id="feedbackMsg" class="feedback-msg"></div>
        </div>
      </div>
    </div>

    <!-- D-Pad Controls for Touch Screens -->
    <div class="controls-panel">
      <div class="dpad-row">
        <button class="dbtn" onclick="handleDpad('UP')">▲</button>
      </div>
      <div class="dpad-row">
        <button class="dbtn" onclick="handleDpad('LEFT')">◄</button>
        <button class="dbtn" onclick="handleDpad('DOWN')">▼</button>
        <button class="dbtn" onclick="handleDpad('RIGHT')">►</button>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 3: PAPARAN AKHIR ================= -->
  <div id="resultScreen" class="screen">
    <div class="result-square-card">
      <div class="res-title">KEPUTUSAN KUIZ</div>
      <div class="res-info" id="resStudentInfo">Ahmad (1 Sukses)</div>
      
      <div class="score-circle">
        <span class="num" id="resFinalScore">30</span>
        <span class="total">/ 30 Markah</span>
      </div>

      <div class="stars-row" id="resStars">⭐⭐⭐</div>

      <button type="button" class="restart-btn" onclick="resetToStart()">MAIN SEMULA 🔄</button>
    </div>
  </div>

</div>

<script>
  /* ----------------------------------------------------
     BANK SOALAN (15 SOALAN WITH CUSTOM SVG ILLUSTRATIONS)
  ---------------------------------------------------- */
  const questionBank = [
    // 1-5: ARAS RENDAH
    {
      level: "Rendah",
      text: "Pembaris A lebih __________ daripada pensel B.",
      options: ["Panjang", "Pendek"],
      correct: "Panjang",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="10" y="15" width="160" height="20" fill="#ff8c42" rx="4"/><text x="20" y="30" font-size="10" fill="#fff">Pembaris A</text><rect x="10" y="45" width="90" height="15" fill="#8a4fff" rx="4"/><text x="15" y="56" font-size="9" fill="#fff">Pensel B</text></svg>`
    },
    {
      level: "Rendah",
      text: "Antara dua objek ini, yang manakah lebih BERAT?",
      options: ["Kereta", "Basikal"],
      correct: "Kereta",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="15" y="25" width="70" height="35" fill="#ff4757" rx="8"/><circle cx="30" cy="60" r="8" fill="#333"/><circle cx="70" cy="60" r="8" fill="#333"/><text x="22" y="45" font-size="10" fill="#fff">Kereta</text><circle cx="150" cy="45" r="16" stroke="#8a4fff" stroke-width="3" fill="none"/><text x="135" y="72" font-size="10" fill="#2d3436">Basikal</text></svg>`
    },
    {
      level: "Rendah",
      text: "Isi padu air di dalam cawan yang penuh adalah __________.",
      options: ["Banyak", "Sedikit"],
      correct: "Banyak",
      svg: `<svg viewBox="0 0 200 80" width="100%"><path d="M70,20 L130,20 L120,70 L80,70 Z" fill="#e0d0ff" stroke="#8a4fff" stroke-width="3"/><path d="M75,25 L125,25 L118,65 L82,65 Z" fill="#ff8c42"/><text x="82" y="50" font-size="12" font-weight="bold" fill="#fff">PENUH</text></svg>`
    },
    {
      level: "Rendah",
      text: "Adakah pemadam ini LEBIH PENDEK daripada pensel?",
      options: ["Betul", "Salah"],
      correct: "Betul",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="20" y="20" width="40" height="20" fill="#ff4757" rx="3"/><text x="23" y="34" font-size="8" fill="#fff">Pemadam</text><rect x="80" y="20" width="100" height="15" fill="#2ed573" rx="3"/><text x="110" y="31" font-size="9" fill="#fff">Pensel</text></svg>`
    },
    {
      level: "Rendah",
      text: "Batu di atas neraca adalah lebih __________ daripada bulu burung.",
      options: ["Berat", "Ringan"],
      correct: "Berat",
      svg: `<svg viewBox="0 0 200 80" width="100%"><path d="M40,65 L160,25" stroke="#2d3436" stroke-width="4"/><polygon points="100,75 90,50 110,50" fill="#8a4fff"/><circle cx="40" cy="55" r="14" fill="#74b9ff"/><text x="30" y="58" font-size="9" fill="#fff">Batu</text><path d="M150,20 Q160,10 170,25" stroke="#ff8c42" stroke-width="3" fill="none"/><text x="145" y="38" font-size="8" fill="#2d3436">Bulu</text></svg>`
    },

    // 6-10: ARAS SEDERHANA
    {
      level: "Sederhana",
      text: "Panjang klip kertas adalah sama dengan _____ unit petak.",
      options: ["3 unit", "5 unit", "2 unit"],
      correct: "3 unit",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="30" y="25" width="30" height="20" fill="#fff" stroke="#333"/><rect x="60" y="25" width="30" height="20" fill="#fff" stroke="#333"/><rect x="90" y="25" width="30" height="20" fill="#fff" stroke="#333"/><rect x="120" y="25" width="30" height="20" fill="#fff" stroke="#333"/><rect x="30" y="52" width="90" height="10" fill="#ff8c42" rx="5"/><text x="60" y="60" font-size="8" fill="#fff">Klip Kertas</text></svg>`
    },
    {
      level: "Sederhana",
      text: "Jisim beg sekolah sama dengan _____ biji guli.",
      options: ["6 biji", "4 biji", "8 biji"],
      correct: "6 biji",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="20" y="20" width="45" height="45" fill="#8a4fff" rx="6"/><text x="30" y="46" font-size="10" fill="#fff">BEG</text><text x="75" y="48" font-size="16" fill="#2d3436">=</text><circle cx="100" cy="45" r="7" fill="#ff8c42"/><circle cx="118" cy="45" r="7" fill="#ff8c42"/><circle cx="136" cy="45" r="7" fill="#ff8c42"/><circle cx="154" cy="45" r="7" fill="#ff8c42"/><circle cx="110" cy="30" r="7" fill="#ff8c42"/><circle cx="128" cy="30" r="7" fill="#ff8c42"/></svg>`
    },
    {
      level: "Sederhana",
      text: "Isi padu air dalam Jug A bersamaan dengan _____ cawan air.",
      options: ["4 cawan", "2 cawan", "6 cawan"],
      correct: "4 cawan",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="20" y="15" width="35" height="50" fill="#74b9ff" rx="4"/><text x="26" y="45" font-size="9" fill="#fff">JUG A</text><text x="65" y="45" font-size="16" fill="#2d3436">=</text><rect x="85" y="30" width="15" height="25" fill="#74b9ff"/><rect x="105" y="30" width="15" height="25" fill="#74b9ff"/><rect x="125" y="30" width="15" height="25" fill="#74b9ff"/><rect x="145" y="30" width="15" height="25" fill="#74b9ff"/></svg>`
    },
    {
      level: "Sederhana",
      text: "Pokok manakah yang paling TINGGI?",
      options: ["Pokok X", "Pokok Y"],
      correct: "Pokok X",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="40" y="30" width="10" height="45" fill="#795548"/><circle cx="45" cy="25" r="20" fill="#2ed573"/><text x="30" y="70" font-size="9" font-weight="bold">Pokok X</text><rect x="140" y="50" width="10" height="25" fill="#795548"/><circle cx="145" cy="45" r="12" fill="#2ed573"/><text x="130" y="70" font-size="9" font-weight="bold">Pokok Y</text></svg>`
    },
    {
      level: "Sederhana",
      text: "Botol yang berisi air separuh/setengah ialah botol _____.",
      options: ["Botol B", "Botol A"],
      correct: "Botol B",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="40" y="15" width="25" height="50" fill="#fff" stroke="#8a4fff" stroke-width="2"/><rect x="40" y="20" width="25" height="45" fill="#ff8c42"/><text x="35" y="75" font-size="9">A (Penuh)</text><rect x="130" y="15" width="25" height="50" fill="#fff" stroke="#8a4fff" stroke-width="2"/><rect x="130" y="40" width="25" height="25" fill="#ff8c42"/><text x="125" y="75" font-size="9">B (Separuh)</text></svg>`
    },

    // 11-15: ARAS TINGGI
    {
      level: "Tinggi",
      text: "Tikar P (4 langkah) dan Tikar Q (6 langkah). Tikar manakah lebih PANJANG?",
      options: ["Tikar Q", "Tikar P"],
      correct: "Tikar Q",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="20" y="15" width="70" height="20" fill="#a29bfe" rx="3"/><text x="25" y="29" font-size="9" fill="#fff">Tikar P (4 langkah)</text><rect x="20" y="45" width="120" height="20" fill="#fd79a8" rx="3"/><text x="25" y="59" font-size="9" fill="#fff">Tikar Q (6 langkah)</text></svg>`
    },
    {
      level: "Tinggi",
      text: "Sebag Tepung = 5 tin susu. Sebag Gula = 3 tin susu. Yang manakah LEBIH RINGAN?",
      options: ["Gula", "Tepung"],
      correct: "Gula",

    {

      options: ["8 cawan", "7 cawan", "6 cawan"],
      correct: "8 cawan",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="30" y="25" width="30" height="35" fill="#74b9ff"/><text x="40" y="46" font-size="10" fill="#fff">M</text><text x="70" y="45" font-size="14">+</text><rect x="85" y="15" width="30" height="45" fill="#0984e3"/><text x="95" y="42" font-size="10" fill="#fff">N</text><text x="125" y="45" font-size="14">=</text><text x="145" y="48" font-size="14" font-weight="bold" fill="#ff8c42">? Cawan</text></svg>`
    },
    {
      level: "Tinggi",
      text: "Panjang bekas pensel = 5 klip kertas. Panjang pensel = 4 klip kertas. Bolehkah pensel disimpan di dalam bekas pensel?",
      options: ["Boleh", "Tidak Boleh"],
      correct: "Boleh",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="20" y="15" width="140" height="25" fill="#8a4fff" rx="6"/><text x="30" y="31" font-size="9" fill="#fff">Bekas Pensel (5 Klip)</text><rect x="20" y="50" width="100" height="12" fill="#ff8c42" rx="3"/><text x="30" y="60" font-size="8" fill="#fff">Pensel (4 Klip)</text></svg>`
    },
    {
      level: "Tinggi",
      text: "Isi padu air tebu KURANG daripada air kelapa. Air manakah yang paling BANYAK?",
      options: ["Air Kelapa", "Air Tebu"],
      correct: "Air Kelapa",
      svg: `<svg viewBox="0 0 200 80" width="100%"><rect x="30" y="20" width="30" height="40" fill="#55efc4" stroke="#00b894" stroke-width="2"/><text x="32" y="44" font-size="8" fill="#2d3436">Air Tebu</text><rect x="120" y="10" width="35" height="55" fill="#00cec9" stroke="#00b894" stroke-width="2"/><text x="121" y="42" font-size="8" fill="#fff">Air Kelapa</text></svg>`
    }
  ];

  /* ----------------------------------------------------
     GLOBAL GAME VARIABLES & STATE
  ---------------------------------------------------- */
  let selectedClass = "1 Sukses";
  let studentName = "";
  let currentScore = 0;
  let currentQuestionIndex = 0;
  let attemptCount = 1;

  // Grid & Snake Configuration
  const gridCount = 20; // 20x20 grid
  let canvas, ctx;
  let gridSize;
  let snake = [];
  let dx = 1, dy = 0;
  let food = { x: 0, y: 0 };
  let gameInterval = null;
  let isGamePaused = false;

  /* ----------------------------------------------------
     SETUP & NAVIGATION FUNCTIONS
  ---------------------------------------------------- */
  function selectClass(className, btn) {
    selectedClass = className;
    document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function startGame() {
    const input = document.getElementById('studentName');
    if (!input.value.trim()) {
      alert("Sila masukkan nama murid terlebih dahulu!");
      return;
    }
    studentName = input.value.trim();
    document.getElementById('playerDisplay').innerText = `${studentName} (${selectedClass})`;
    
    // Reset Game State
    currentScore = 0;
    currentQuestionIndex = 0;
    document.getElementById('currentScore').innerText = currentScore;

    showScreen('gameScreen');
    initCanvas();
    initSnakeGame();
  }

  function resetToStart() {
    document.getElementById('studentName').value = "";
    showScreen('startScreen');
  }

  /* ----------------------------------------------------
     SNAKE GAME ENGINE (SLOW & TOUCH-FRIENDLY)
  ---------------------------------------------------- */
  function initCanvas() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    
    // Set internal resolution
    canvas.width = 400;
    canvas.height = 400;
    gridSize = canvas.width / gridCount;

    // Attach Swipe Gestures directly to the Canvas
    setupSwipeControls(canvas);
  }

  function initSnakeGame() {
    // Initial snake position (middle)
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];
    dx = 1; dy = 0;
    isGamePaused = false;

    spawnFood();

    if (gameInterval) clearInterval(gameInterval);
    // 280ms per tick: SLOW SPEED tailored for Year 1 kids
    gameInterval = setInterval(gameLoop, 280);
  }

  function spawnFood() {
    food.x = Math.floor(Math.random() * gridCount);
    food.y = Math.floor(Math.random() * gridCount);
    
    // Ensure food doesn't spawn on top of snake body
    snake.forEach(part => {
      if (part.x === food.x && part.y === food.y) {
        spawnFood();
      }
    });
  }

  function gameLoop() {
    if (isGamePaused) return;

    // Move Snake Head
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };

    // Wall Wrap-Around (No insta-death for gentle gameplay)
    if (head.x < 0) head.x = gridCount - 1;
    if (head.x >= gridCount) head.x = 0;
    if (head.y < 0) head.y = gridCount - 1;
    if (head.y >= gridCount) head.y = 0;

    // Add new head
    snake.unshift(head);

    // Check Food Collision
    if (head.x === food.x && head.y === food.y) {
      isGamePaused = true;
      triggerQuestionModal();
    } else {
      snake.pop(); // Remove tail if no food eaten
    }

    drawGame();
  }

  function drawGame() {
    // Clear Canvas
    ctx.fillStyle = '#f7f2ff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw Grid Lines (Subtle)
    ctx.strokeStyle = '#eae0fb';
    ctx.lineWidth = 1;
    for (let i = 0; i <= gridCount; i++) {
      ctx.beginPath();
      ctx.moveTo(i * gridSize, 0);
      ctx.lineTo(i * gridSize, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, i * gridSize);
      ctx.lineTo(canvas.width, i * gridSize);
      ctx.stroke();
    }

    // Draw Food (Cute Apple/Star shape)
    ctx.fillStyle = '#ff8c42';
    ctx.beginPath();
    ctx.arc(
      food.x * gridSize + gridSize/2, 
      food.y * gridSize + gridSize/2, 
      gridSize/2 - 2, 0, Math.PI * 2
    );
    ctx.fill();

    // Draw Snake
    snake.forEach((part, index) => {
      ctx.fillStyle = (index === 0) ? '#5e22ca' : '#8a4fff'; // Head darker purple
      ctx.beginPath();
      ctx.roundRect(
        part.x * gridSize + 1, 
        part.y * gridSize + 1, 
        gridSize - 2, 
        gridSize - 2, 
        index === 0 ? 6 : 4
      );
      ctx.fill();

      // Eyes on snake head
      if (index === 0) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(part.x * gridSize + 6, part.y * gridSize + 6, 2.5, 0, Math.PI * 2);
        ctx.arc(part.x * gridSize + 14, part.y * gridSize + 6, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  /* ----------------------------------------------------
     CONTROLS: KEYBOARD, D-PAD & TOUCH SWIPE
  ---------------------------------------------------- */
  function changeDirection(newDx, newDy) {
    if (isGamePaused) return;
    // Prevent 180-degree reverse turning
    if (newDx === -dx && newDx !== 0) return;
    if (newDy === -dy && newDy !== 0) return;
    dx = newDx;
    dy = newDy;
  }

  // 1. Keyboard Arrow Controls
  window.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowUp': changeDirection(0, -1); break;
      case 'ArrowDown': changeDirection(0, 1); break;
      case 'ArrowLeft': changeDirection(-1, 0); break;
      case 'ArrowRight': changeDirection(1, 0); break;
    }
  });

  // 2. Touch D-Pad Controls
  function handleDpad(dir) {
    if (dir === 'UP') changeDirection(0, -1);
    if (dir === 'DOWN') changeDirection(0, 1);
    if (dir === 'LEFT') changeDirection(-1, 0);
    if (dir === 'RIGHT') changeDirection(1, 0);
  }

  // 3. Touch Screen Swipe Controls
  function setupSwipeControls(targetElement) {
    let touchStartX = 0;
    let touchStartY = 0;

    targetElement.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    targetElement.addEventListener('touchend', function(e) {
      let touchEndX = e.changedTouches[0].screenX;
      let touchEndY = e.changedTouches[0].screenY;
      handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
    }, { passive: true });
  }

  function handleSwipe(startX, startY, endX, endY) {
    let diffX = endX - startX;
    let diffY = endY - startY;
    let minSwipeDistance = 25; // threshold

    if (Math.abs(diffX) > Math.abs(diffY)) {
      // Horizontal swipe
      if (Math.abs(diffX) > minSwipeDistance) {
        if (diffX > 0) changeDirection(1, 0);  // Right
        else changeDirection(-1, 0);           // Left
      }
    } else {
      // Vertical swipe
      if (Math.abs(diffY) > minSwipeDistance) {
        if (diffY > 0) changeDirection(0, 1);  // Down
        else changeDirection(0, -1);           // Up
      }
    }
  }

  /* ----------------------------------------------------
     QUESTION MODAL & SCORING SYSTEM
  ---------------------------------------------------- */
  function triggerQuestionModal() {
    attemptCount = 1;
    const qData = questionBank[currentQuestionIndex];

    document.getElementById('qNum').innerText = `Soalan ${currentQuestionIndex + 1}/15`;
    document.getElementById('qLevel').innerText = `Aras: ${qData.level}`;
    document.getElementById('qImage').innerHTML = qData.svg;
    document.getElementById('qText').innerText = qData.text;
    document.getElementById('attemptText').innerText = "Percubaan Pertama (2 Markah)";
    document.getElementById('feedbackMsg').innerText = "";
    document.getElementById('feedbackMsg').className = "feedback-msg";

    // Render Option Buttons
    const optsContainer = document.getElementById('optionsContainer');
    optsContainer.innerHTML = "";

    qData.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.onclick = () => checkAnswer(opt, qData.correct);
      optsContainer.appendChild(btn);
    });

    document.getElementById('questionModal').classList.add('active');
  }

  function checkAnswer(selectedOpt, correctOpt) {
    const feedback = document.getElementById('feedbackMsg');

    if (selectedOpt === correctOpt) {
      // Correct Answer logic
      let pointsAwarded = (attemptCount === 1) ? 2 : 1;
      currentScore += pointsAwarded;
      document.getElementById('currentScore').innerText = currentScore;

      feedback.innerText = `Tahniah! Jawapan Betul (+${pointsAwarded} markah)`;
      feedback.className = "feedback-msg correct";

      setTimeout(() => {
        closeQuestionModal();
      }, 1200);

    } else {
      // Wrong Answer logic
      if (attemptCount === 1) {
        attemptCount = 2;
        feedback.innerText = "Jawapan kurang tepat. Cuba kali kedua!";
        feedback.className = "feedback-msg wrong";
        document.getElementById('attemptText').innerText = "Percubaan Kedua (1 Markah)";
      } else {
        feedback.innerText = `Salah! Jawapan betul ialah: ${correctOpt}`;
        feedback.className = "feedback-msg wrong";

        setTimeout(() => {
          closeQuestionModal();
        }, 1800);
      }
    }
  }

  function closeQuestionModal() {
    document.getElementById('questionModal').classList.remove('active');
    currentQuestionIndex++;

    if (currentQuestionIndex >= questionBank.length) {
      // All 15 questions completed!
      finishGame();
    } else {
      // Resume Game
      spawnFood();
      isGamePaused = false;
    }
  }

  /* ----------------------------------------------------
     FINISH GAME & FINAL RESULT DISPLAY
  ---------------------------------------------------- */
  function finishGame() {
    if (gameInterval) clearInterval(gameInterval);
    showScreen('resultScreen');

    document.getElementById('resStudentInfo').innerText = `${studentName} (${selectedClass})`;
    document.getElementById('resFinalScore').innerText = currentScore;

    // Star Rating Logic (Max 30)
    let stars = "⭐☆☆";
    if (currentScore >= 24) stars = "⭐⭐⭐";
    else if (currentScore >= 12) stars = "⭐⭐☆";

    document.getElementById('resStars').innerText = stars;
  }
</script>
